name: A11b seal safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-suite:
    # The frozen power receipt binds exact Python/libm output generated on
    # macOS. Running receipt verification on glibc changes raw power summaries
    # by a few ULPs and correctly fails the exact-byte seal. A platform-neutral
    # power algorithm requires a new versioned receipt and belongs in the
    # successor reseal, not an in-place mutation of historical evidence.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile tracked Python
        run: python -m compileall -q .
      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -v

  macos-installer-protocol:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise installer and runner protocol boundaries
        run: >-
          python -m unittest -v
          tests.test_experiment_executor_deploy
          tests.test_a11b_nightly_runner
          tests.test_experiment_executor_install
          tests.test_experiment_anchor
